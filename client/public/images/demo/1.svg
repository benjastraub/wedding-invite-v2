<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Flower illustration">
  <rect width="400" height="400" fill="#f7f3e8"/>
  <!-- stem and leaves -->
  <path d="M200 252 V150" stroke="#879a7b" stroke-width="7" stroke-linecap="round"/>
  <path d="M200 230 Q168 210 152 188 M200 190 Q232 170 248 148" stroke="#5f8a4f" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- petals -->
  <g fill="#5f8a4f">
    <ellipse cx="200" cy="108" rx="26" ry="42"/>
    <ellipse cx="200" cy="108" rx="26" ry="42" transform="rotate(60 200 108)"/>
    <ellipse cx="200" cy="108" rx="26" ry="42" transform="rotate(120 200 108)"/>
  </g>
  <g fill="#879a7b">
    <ellipse cx="200" cy="108" rx="20" ry="34"/>
    <ellipse cx="200" cy="108" rx="20" ry="34" transform="rotate(60 200 108)"/>
    <ellipse cx="200" cy="108" rx="20" ry="34" transform="rotate(120 200 108)"/>
  </g>
  <circle cx="200" cy="108" r="16" fill="#c9a86a"/>
  <!-- sparkles -->
  <g stroke="#c9a86a" stroke-width="5" stroke-linecap="round">
    <path d="M96 120 v26 M83 133 h26"/>
    <path d="M296 240 v18 M287 249 h18"/>
  </g>
</svg>
